name: ansible-lint

on:
  push:
    branches: ["dev"]

jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Ansible, ansible-lint, and required collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
          ansible-galaxy collection install community.general ansible.posix community.docker gluster.gluster ansible.windows
      - name: Run ansible-lint on playbooks and roles
        env:
          ANSIBLE_COLLECTIONS_PATH: ~/.ansible/collections:/usr/share/ansible/collections
        run: |
          ansible-lint *.yaml roles/*/tasks/*.yml

      - name: Discord webhook alert
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$GITHUB_JOB" = "build" ]; then
            if [ "$GITHUB_RUN_ATTEMPT" -eq 1 ]; then
              STATUS="${{ job.status }}"
              if [ "$STATUS" = "success" ]; then
                MESSAGE="✅ Ansible-lint workflow succeeded on $GITHUB_REPOSITORY@$GITHUB_REF."
              else
                MESSAGE="❌ Ansible-lint workflow failed on $GITHUB_REPOSITORY@$GITHUB_REF."
              fi
              curl -H "Content-Type: application/json" -X POST -d '{"content": "'$MESSAGE'"}' "$DISCORD_WEBHOOK"
            fi
          fi
