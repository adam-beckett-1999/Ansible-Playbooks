- name: Rolling reboot of Proxmox Cluster
  hosts: pve_core_cluster_01
  serial: 1
  become: true
  vars:
    vms_on_node: []
    all_reports: []
  gather_facts: true
  roles:
    - proxmox-migration-check-vms-initial
    - proxmox-node-reboot
    - proxmox-migration-check-vms-returned

- name: Report Proxmox Cluster reboot status to Discord Channel
  hosts: pve_core_cluster_01
  gather_facts: true
  roles:
    - proxmox-cluster-reboot-report
  vars:
    reboot_report_discord_webhook_url: "{{ lookup('env', 'REBOOT_REPORT_DISCORD_WEBHOOK_URL') }}"
