- name: Install updates and standard packages, configure SNMP and network shares
  hosts: game_servers
  roles:
    - time-sync
    - update
    - base-packages
    - disable-motd-ubuntu
    - webmin-install
    - snmp-configure
  vars:
    user: abeckett

- name: Install Pelican Panel (Game Server Management Interface)
  hosts: game_server_panel
  become: yes
  vars:
    pelican_domain: "{{ lookup('env', 'PELICAN_PANEL_DOMAIN') }}"
    pelican_db_password: "{{ lookup('env', 'PELICAN_DB_PASSWORD') }}"
    mysql_root_password: "{{ lookup('env', 'PELICAN_DB_ROOT_PASSWORD') }}"
    pelican_admin_email: "{{ lookup('env', 'PELICAN_ADMIN_EMAIL') }}"
    pelican_admin_username: "{{ lookup('env', 'PELICAN_ADMIN_USERNAME') }}"
    pelican_admin_first_name: "{{ lookup('env', 'PELICAN_ADMIN_FIRST_NAME') }}"
    pelican_admin_last_name: "{{ lookup('env', 'PELICAN_ADMIN_LAST_NAME') }}"
    pelican_admin_password: "{{ lookup('env', 'PELICAN_ADMIN_PASSWORD') }}"
  roles:
    - install-pelican-panel

- name: Install Pelican Wings (Game Server Daemon)
  hosts: game_server_nodes
  become: yes
  roles:
    - install-pelican-wings
