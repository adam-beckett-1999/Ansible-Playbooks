- name: Disable MOTD on login
  ansible.builtin.shell: |
        chmod -x /etc/update-motd.d/*
  changed_when: false
  when:
      - ansible_distribution == 'Ubuntu'
- name: Disable the MOTD service to stop errors
  ansible.builtin.systemd_service:
      name: motd-news.service
      enabled: false
      state: stopped
      masked: true
  when:
      - ansible_distribution == 'Ubuntu'
