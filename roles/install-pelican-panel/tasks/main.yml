---
- name: Add ondrej/php PPA repository (Ubuntu only)
  apt_repository:
    repo: "ppa:ondrej/php"
    state: present
    update_cache: yes
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: Add Sury PHP repository for Debian
  block:
    - name: Add Sury PHP repository GPG key
      apt_key:
        url: https://packages.sury.org/php/apt.gpg
        state: present
      become: yes

    - name: Add Sury PHP repository
      apt_repository:
        repo: "deb https://packages.sury.org/php/ {{ ansible_distribution_release }} main"
        state: present
        update_cache: yes
      become: yes
  when: ansible_distribution == "Debian"

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install MySQL/MariaDB server (distribution-specific)
  block:
    - name: Install MySQL server on Ubuntu
      apt:
        name: mysql-server
        state: present
      become: yes
      when: ansible_distribution == "Ubuntu"

    - name: Install MariaDB server on Debian
      apt:
        name: 
          - mariadb-server
          - mariadb-client
        state: present
      become: yes
      when: ansible_distribution == "Debian"

- name: Install other required packages
  apt:
    name:
      - nginx
      - sqlite3
      - "php8.2"
      - "php8.2-cli"
      - "php8.2-common"
      - "php8.2-mysql"
      - "php8.2-sqlite3"
      - "php8.2-fpm"
      - "php8.2-mbstring"
      - "php8.2-xml"
      - "php8.2-bcmath"
      - "php8.2-curl"
      - "php8.2-zip"
      - "php8.2-gd"
      - "php8.2-intl"
      - git
      - unzip
      - python3-pymysql
      - python3-mysqldb
    state: present
  become: yes

- name: restart nginx
  systemd:
    name: nginx
    state: restarted
  become: yes

- name: reload nginx
  systemd:
    name: nginx
    state: reloaded
  become: yes

- name: Start and enable MySQL/MariaDB service
  systemd:
    name: "{{ 'mysql' if ansible_distribution == 'Ubuntu' else 'mariadb' }}"
    state: started
    enabled: true
  become: yes

- name: Secure MySQL/MariaDB installation
  mysql_user:
    name: root
    password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: root
    login_password: ""
  become: yes
  ignore_errors: yes

- name: Create Pelican database
  mysql_db:
    name: pelican
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: root
    login_password: "{{ mysql_root_password | default('') }}"
  become: yes

- name: Create Pelican database user
  mysql_user:
    name: pelicanuser
    password: "{{ pelican_db_password }}"
    priv: "pelican.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: root
    login_password: "{{ mysql_root_password | default('') }}"
  become: yes

- name: Install Docker prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
  become: yes

- name: Create Docker GPG keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Download and add Docker GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  become: yes
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes
  become: yes

- name: Install Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: yes

- name: restart docker
  systemd:
    name: docker
    state: restarted
  become: yes

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: true
  become: yes

- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  become: yes

- name: Download and install Composer
  shell: |
    curl -sS https://getcomposer.org/installer | php
    mv composer.phar /usr/local/bin/composer
    chmod +x /usr/local/bin/composer
  become: yes
  args:
    creates: /usr/local/bin/composer

- name: Create Pelican installation directory
  file:
    path: /var/www/pelican
    state: directory
    owner: "{{ ansible_user }}"
    group: www-data
    mode: '0775'
  become: yes

- name: Download Pelican Panel
  unarchive:
    src: https://github.com/pelican-dev/panel/releases/latest/download/panel.tar.gz
    dest: /var/www/pelican
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: www-data
    mode: '0775'
  become: yes

- name: Install PHP dependencies with Composer
  composer:
    command: install
    arguments: "--no-dev --optimize-autoloader"
    working_dir: /var/www/pelican
  become: yes
  become_user: "{{ ansible_user }}"

- name: Set proper ownership for Pelican files
  file:
    path: /var/www/pelican
    owner: www-data
    group: www-data
    recurse: yes
  become: yes

- name: Set permissions for storage and bootstrap cache
  file:
    path: "{{ item }}"
    mode: '0755'
    recurse: yes
  loop:
    - "/var/www/pelican/storage"
    - "/var/www/pelican/bootstrap/cache"
  become: yes

- name: Run Pelican environment setup
  shell: |
    cd /var/www/pelican
    sudo -u www-data php artisan p:environment:setup --new-salt --author={{ ansible_user }} --url=http://{{ ansible_default_ipv4.address }} --timezone=UTC --cache=database --session=database --queue=database --redis-host=127.0.0.1 --redis-pass= --redis-port=6379 --settings-ui=true
  become: yes
  args:
    creates: /var/www/pelican/.env

- name: Set secure permissions for .env file
  file:
    path: /var/www/pelican/.env
    mode: '0640'
    owner: www-data
    group: www-data
  become: yes

- name: Run database migrations
  shell: |
    cd /var/www/pelican
    sudo -u www-data php artisan migrate --seed --force
  become: yes
  environment:
    COMPOSER_ALLOW_SUPERUSER: "1"

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: yes

- name: Create Pelican nginx configuration
  template:
    src: nginx-pelican.conf.j2
    dest: /etc/nginx/sites-available/pelican.conf
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Enable Pelican site
  file:
    src: /etc/nginx/sites-available/pelican.conf
    dest: /etc/nginx/sites-enabled/pelican.conf
    state: link
  become: yes
 
- name: reload nginx
  systemd:
    name: nginx
    state: reloaded
  become: yes

- name: Test nginx configuration
  command: nginx -t
  become: yes
  changed_when: false

- name: Start and enable nginx
  systemd:
    name: nginx
    state: started
    enabled: true
  become: yes

- name: Start and enable PHP-FPM
  systemd:
    name: "php8.2-fpm"
    state: started
    enabled: true
  become: yes

- name: Start and enable MySQL/MariaDB
  systemd:
    name: "{{ 'mysql' if ansible_distribution == 'Ubuntu' else 'mariadb' }}"
    state: started
    enabled: true
  become: yes

- name: Display Pelican Panel installation completion message
  debug:
    msg: |
      ========================================
      Pelican Panel Installation Complete!
      ========================================
      
      Panel URL: http://{{ pelican_domain }}
      Web Installer: http://{{ pelican_domain }}/installer

      Database Details:
      Database: pelican
      DB User: pelicanuser
      DB Password: {{ pelican_db_password }}
      
      IMPORTANT: 
      1. Visit the web installer to complete setup
      2. Change the default admin password immediately
      3. Back up your APP_KEY from /var/www/pelican/.env
      ========================================