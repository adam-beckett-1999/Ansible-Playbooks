- name: Install Docker prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
  become: yes

- name: Create Docker GPG keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Clean up any existing Docker GPG key
  file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent
  become: yes
  when: ansible_check_mode == false

- name: Download and add Docker GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
    ls -la /etc/apt/keyrings/docker.gpg
  become: yes
  register: gpg_key_result
  retries: 3
  delay: 5

- name: Verify Docker GPG key was created
  stat:
    path: /etc/apt/keyrings/docker.gpg
  register: docker_gpg_stat
  become: yes

- name: Fail if Docker GPG key is missing
  fail:
    msg: "Docker GPG key was not created successfully"
  when: not docker_gpg_stat.stat.exists

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes
  become: yes
  retries: 3
  delay: 10

- name: Install Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: yes

- name: Restart docker
  systemd:
    name: docker
    state: restarted
  become: yes

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: true
  become: yes

- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  become: yes

- name: Create Wings directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/pelican
    - /var/run/wings
  become: yes

- name: Download Wings binary
  get_url:
    url: "https://github.com/pelican-dev/wings/releases/latest/download/wings_linux_amd64"
    dest: /usr/local/bin/wings
    mode: '0755'
    owner: root
    group: root
  become: yes

- name: Display Wings installation completion message
  debug:
    msg: |
      Wings installation completed!
      
      Next steps:
      Use the Auto Deploy Command from the Panel for automatic setup
