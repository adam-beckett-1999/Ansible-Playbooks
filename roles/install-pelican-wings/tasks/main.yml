- name: Install Docker prerequisites
  apt:
    name:
      - gnupg
      - lsb-release
    state: present
  become: yes

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: yes

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes
  become: yes

- name: Install Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: yes

- name: restart docker
  systemd:
    name: docker
    state: restarted
  become: yes

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: true
  become: yes

- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  become: yes

- name: Create Wings directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/pelican
    - /var/run/wings
  become: yes

- name: Download Wings binary
  get_url:
    url: "https://github.com/pelican-dev/wings/releases/latest/download/wings_linux_amd64"
    dest: /usr/local/bin/wings
    mode: '0755'
    owner: root
    group: root
  become: yes

- name: Display Wings installation completion message
  debug:
    msg: |
      Wings installation completed!
      
      Next steps:
      Use the Auto Deploy Command from the Panel for automatic setup
