- name: Gather current HA VM/LXC status on this host
  shell: |
    ha-manager status | awk '/^Resources:/,/^$/' | grep $(hostname) | awk '{print $1":"$2}'
  register: ha_vms_status

- name: Parse HA VM/LXC status
  set_fact:
    host_ha_vms: >-
      {%- set vms = [] -%}
      {%- for line in ha_vms_status.stdout_lines -%}
        {%- set parts = line.split(':') -%}
        {%- if parts|length >= 2 -%}
          {{ vms.append({'name': parts[0], 'state': parts[1]}) }}
        {%- endif -%}
      {%- endfor -%}
      {{ vms }}

- name: Filter non-HA VMs/LXCs for this host
  set_fact:
    host_non_ha_vms: "{{ proxmox_non_ha_vms_lxcs | default([]) }}"

- name: Add host data to global report
  set_fact:
    all_reports: >-
      {{ all_reports | default([]) + [{
        'host': inventory_hostname,
        'ha_vms': host_ha_vms,
        'non_ha_vms': host_non_ha_vms
      }] }}
  delegate_facts: true
  run_once: true

- name: Format embed fields for Discord
  set_fact:
    embed_fields: >-
      {%- set fields = [] -%}
      {%- for report in all_reports -%}
        {%- set ha_vm_list = [] -%}
        {%- for vm in report.ha_vms -%}
          {{ ha_vm_list.append(vm.name + " (" + vm.state + ")") }}
        {%- endfor -%}
        {%- set non_ha_vm_list = [] -%}
        {%- for vm in report.non_ha_vms -%}
          {{ non_ha_vm_list.append(vm.type|upper + " " + vm.id + ":" + vm.name + " (" + vm.state + ")") }}
        {%- endfor -%}
        {{ fields.append({
          'name': '🖥️ ' + report.host + ' - HA VMs/LXCs',
          'value': (ha_vm_list | join('\n')) if ha_vm_list else 'None',
          'inline': False
        }) }}
        {{ fields.append({
          'name': '📦 ' + report.host + ' - Non-HA VMs/LXCs',
          'value': (non_ha_vm_list | join('\n')) if non_ha_vm_list else 'None',
          'inline': False
        }) }}
      {%- endfor -%}
      {{ fields }}
  run_once: true

- name: Set local time for report
  set_fact:
    local_time_uk: "{{ lookup('pipe', 'date -u +\"%Y-%m-%d %H:%M:%S UTC\"') }}"
  run_once: true
  delegate_to: localhost

- name: Send single aggregated Discord alert
  uri:
    url: "{{ reboot_report_discord_webhook_url }}"
    method: POST
    headers:
      Content-Type: "application/json"
    status_code: 204
    body_format: json
    body:
      embeds:
        - title: "✅ Proxmox Cluster Reboot Successful"
          description: "All nodes rebooted successfully. Current VM/LXC status:"
          color: 3066993
          fields: "{{ embed_fields }}"
          footer:
            text: "Reported at {{ local_time_uk }}"
  run_once: true
  delegate_to: localhost