- name: Debug - Check if initial data file exists
  stat:
    path: "/tmp/proxmox_initial_data_{{ inventory_hostname }}.yml"
  register: initial_data_file
  delegate_to: localhost

- name: Debug - Show file status
  debug:
    msg: "Initial data file exists: {{ initial_data_file.stat.exists }}"

- name: Load initial VM/LXC data from file (fallback for variable persistence)
  include_vars: "/tmp/proxmox_initial_data_{{ inventory_hostname }}.yml"
  delegate_to: localhost
  when: 
    - proxmox_non_ha_vms_lxcs is not defined
    - initial_data_file.stat.exists

- name: Debug - Check proxmox_non_ha_vms_lxcs variable
  debug:
    msg: "proxmox_non_ha_vms_lxcs: {{ proxmox_non_ha_vms_lxcs | default('UNDEFINED') }}"

- name: Get current HA status for all resources
  shell: |
    ha-manager status | awk '/^service/ {print $2":"$4":"$3}' | sed 's/[(),]//g'
  register: current_ha_status
  failed_when: false

- name: Debug - Show current HA status
  debug:
    var: current_ha_status.stdout_lines

- name: Filter HA VMs/LXCs currently on this host
  set_fact:
    current_ha_on_host: []

- name: Build current HA VMs list for this host
  set_fact:
    current_ha_on_host: "{{ current_ha_on_host + [parts[0] + ' (' + parts[1] + ')'] }}"
  vars:
    parts: "{{ item.split(':') }}"
  loop: "{{ current_ha_status.stdout_lines }}"
  when:
    - parts | length >= 3
    - parts[2] == inventory_hostname
    - parts[1] in ['started', 'stopped', 'relocate']

- name: Debug - Current HA VMs on this host
  debug:
    var: current_ha_on_host

- name: Build pre-reboot non-HA VMs list
  set_fact:
    pre_reboot_non_ha_list: []

- name: Add non-HA VMs to list
  set_fact:
    pre_reboot_non_ha_list: "{{ pre_reboot_non_ha_list + [item.type|upper + ' ' + item.id + ':' + item.name + ' (' + item.state + ')'] }}"
  loop: "{{ proxmox_non_ha_vms_lxcs | default([]) }}"

- name: Debug - Pre-reboot non-HA list
  debug:
    var: pre_reboot_non_ha_list

- name: Create host report
  set_fact:
    host_report_data:
      hostname: "{{ inventory_hostname }}"
      ha_vms_text: "{{ current_ha_on_host | join('\n') if current_ha_on_host | length > 0 else 'None' }}"
      non_ha_vms_text: "{{ pre_reboot_non_ha_list | join('\n') if pre_reboot_non_ha_list | length > 0 else 'None' }}"

- name: Debug - Host report data
  debug:
    var: host_report_data

- name: Store report in temporary file
  copy:
    content: "{{ host_report_data | to_json }}"
    dest: "/tmp/proxmox_report_{{ inventory_hostname }}.json"
  delegate_to: localhost

- name: Wait for all hosts to complete reporting
  pause:
    seconds: 3
  run_once: true

- name: Collect all host reports
  set_fact:
    all_collected_reports: []
  run_once: true

- name: Read each host report
  set_fact:
    all_collected_reports: "{{ all_collected_reports + [lookup('file', '/tmp/proxmox_report_' + item + '.json') | from_json] }}"
  loop: "{{ groups['pve_test_cluster_01'] }}"
  run_once: true

- name: Debug - All collected reports
  debug:
    var: all_collected_reports
  run_once: true

- name: Create Discord embed fields
  set_fact:
    discord_embed_fields: []
  run_once: true

- name: Build HA VM fields
  set_fact:
    discord_embed_fields: "{{ discord_embed_fields + [{'name': '🖥️ ' + item.hostname + ' - HA VMs/LXCs (Current State)', 'value': item.ha_vms_text, 'inline': false}] }}"
  loop: "{{ all_collected_reports }}"
  run_once: true

- name: Build non-HA VM fields
  set_fact:
    discord_embed_fields: "{{ discord_embed_fields + [{'name': '📦 ' + item.hostname + ' - Non-HA VMs/LXCs (Pre-Reboot State)', 'value': item.non_ha_vms_text, 'inline': false}] }}"
  loop: "{{ all_collected_reports }}"
  run_once: true

- name: Get timestamp
  command: date -u '+%Y-%m-%d %H:%M:%S UTC'
  register: current_timestamp
  run_once: true
  changed_when: false

- name: Send Discord notification
  uri:
    url: "{{ reboot_report_discord_webhook_url }}"
    method: POST
    headers:
      Content-Type: "application/json"
    status_code: 204
    body_format: json
    body:
      embeds:
        - title: "✅ Proxmox Cluster Reboot Successful"
          description: "All nodes rebooted successfully. VM/LXC status report:"
          color: 3066993
          fields: "{{ discord_embed_fields }}"
          footer:
            text: "Reported at {{ current_timestamp.stdout }}"
  run_once: true

- name: Clean up temporary files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/proxmox_report_{{ inventory_hostname }}.json"
    - "/tmp/proxmox_initial_data_{{ inventory_hostname }}.yml"
  delegate_to: localhost
  run_once: true