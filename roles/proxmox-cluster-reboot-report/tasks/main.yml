- name: Gather current HA VM/LXC status on this host
  shell: |
    ha-manager status | awk '/^Resources:/,/^$/' | grep $(hostname) | awk '{print $1":"$2}'
  register: ha_vms_status
  failed_when: false

- name: Get HA resource IDs for filtering
  shell: |
    ha-manager config | grep -E '^(vm|ct):' | awk -F: '{print $2}'
  register: ha_resource_ids
  changed_when: false
  failed_when: false

- name: Process current HA VMs data
  set_fact:
    current_ha_vms_list: []

- name: Build current HA VMs list
  set_fact:
    current_ha_vms_list: "{{ current_ha_vms_list + [line.split(':')[0] + ' (' + line.split(':')[1] + ')'] }}"
  loop: "{{ ha_vms_status.stdout_lines }}"
  when: ha_vms_status.stdout_lines | length > 0

- name: Debug - Show proxmox_non_ha_vms_lxcs data
  debug:
    msg: "Non-HA VMs/LXCs for {{ inventory_hostname }}: {{ proxmox_non_ha_vms_lxcs | default('UNDEFINED') }}"

- name: Use pre-reboot non-HA VM/LXC data from initial check
  set_fact:
    pre_reboot_non_ha_list: []

- name: Build pre-reboot non-HA VMs list from initial data
  set_fact:
    pre_reboot_non_ha_list: "{{ pre_reboot_non_ha_list + [item.type|upper + ' ' + item.id + ':' + item.name + ' (' + item.state + ')'] }}"
  loop: "{{ proxmox_non_ha_vms_lxcs | default([]) }}"
  when: proxmox_non_ha_vms_lxcs is defined

- name: Create report using pre-reboot data
  set_fact:
    host_report_data:
      hostname: "{{ inventory_hostname }}"
      ha_vms_text: "{{ current_ha_vms_list | join('\n') if current_ha_vms_list | length > 0 else 'None' }}"
      non_ha_vms_text: "{{ pre_reboot_non_ha_list | join('\n') if pre_reboot_non_ha_list | length > 0 else 'None' }}"

- name: Debug - Show host report data
  debug:
    var: host_report_data

- name: Store report in a temporary file for collection
  copy:
    content: "{{ host_report_data | to_json }}"
    dest: "/tmp/proxmox_report_{{ inventory_hostname }}.json"
  delegate_to: localhost

- name: Wait for all hosts to complete their reporting
  pause:
    seconds: 5
  run_once: true

- name: Collect all host reports from temp files
  set_fact:
    all_collected_reports: []
  run_once: true

- name: Read each host report file
  set_fact:
    all_collected_reports: "{{ all_collected_reports + [lookup('file', '/tmp/proxmox_report_' + item + '.json') | from_json] }}"
  loop: "{{ groups['pve_test_cluster_01'] }}"
  run_once: true

- name: Debug - Show all collected reports
  debug:
    var: all_collected_reports
  run_once: true

- name: Create Discord embed fields
  set_fact:
    discord_embed_fields: []
  run_once: true

- name: Build HA VM fields for all hosts
  set_fact:
    discord_embed_fields: "{{ discord_embed_fields + [{'name': '🖥️ ' + item.hostname + ' - HA VMs/LXCs (Current State)', 'value': item.ha_vms_text, 'inline': false}] }}"
  loop: "{{ all_collected_reports }}"
  run_once: true

- name: Build non-HA VM fields for all hosts
  set_fact:
    discord_embed_fields: "{{ discord_embed_fields + [{'name': '📦 ' + item.hostname + ' - Non-HA VMs/LXCs (Pre-Reboot State)', 'value': item.non_ha_vms_text, 'inline': false}] }}"
  loop: "{{ all_collected_reports }}"
  run_once: true

- name: Get current timestamp
  command: date -u '+%Y-%m-%d %H:%M:%S UTC'
  register: current_timestamp
  run_once: true
  changed_when: false

- name: Send Discord notification
  uri:
    url: "{{ reboot_report_discord_webhook_url }}"
    method: POST
    headers:
      Content-Type: "application/json"
    status_code: 204
    body_format: json
    body:
      embeds:
        - title: "✅ Proxmox Cluster Reboot Successful"
          description: "All nodes rebooted successfully. VM/LXC status report:"
          color: 3066993
          fields: "{{ discord_embed_fields }}"
          footer:
            text: "Reported at {{ current_timestamp.stdout }}"
  run_once: true

- name: Clean up temporary report files
  file:
    path: "/tmp/proxmox_report_{{ item }}.json"
    state: absent
  loop: "{{ groups['pve_test_cluster_01'] }}"
  delegate_to: localhost
  run_once: true