- name: Gather running VMs/LXCs on this host
  shell: |
    ha-manager status | awk '/^Resources:/,/^$/' | grep started | grep $(hostname) | awk '{print $1}'
  register: running_vms

- name: Set fact for running VMs/LXCs
  set_fact:
    host_vms: "{{ running_vms.stdout_lines }}"

- name: Add host and VMs to global list
  set_fact:
    all_reports: "{{ all_reports | default([]) + [ { 'host': inventory_hostname, 'vms': host_vms } ] }}"
  delegate_facts: true
  run_once: true

- name: Format embed fields for Discord
  set_fact:
    embed_fields: >-
      {%- set fields = [] -%}
      {%- for report in all_reports -%}
      {{ fields.append({
        'name': report.host,
        'value': (report.vms | join(', ')) ~ ' | ',
        'inline': False
      }) }}
      {%- endfor -%}
      {{ fields }}
  run_once: true

- name: Format non-HA VM/LXC list for Discord
  set_fact:
    non_ha_list_formatted: |
      {% for item in proxmox_non_ha_vms_lxcs %}
      - {{ item.type|upper }} {{ item.id }}: {{ item.state|upper }}
      {% endfor %}
  when: proxmox_non_ha_vms_lxcs is defined
  run_once: true

- name: Add non-HA VM/LXC field to embed fields
  set_fact:
    embed_fields: >-
      {{
        embed_fields + [
          {
            'name': 'Non-HA VMs/LXCs',
            'value': non_ha_list_formatted | default('None found'),
            'inline': False
          }
        ]
      }}
  when: proxmox_non_ha_vms_lxcs is defined
  run_once: true

- name: Set local time for report
  set_fact:
    local_time_uk: "{{ lookup('pipe', 'date -u +\"%Y-%m-%d %H:%M:%S UTC\"') }}"
  run_once: true
  delegate_to: localhost

- name: Send single aggregated Discord alert
  uri:
    url: "{{ reboot_report_discord_webhook_url }}"
    method: POST
    headers:
      Content-Type: "application/json"
    status_code: 204
    body_format: json
    body:
      embeds:
        - title: "✅ Proxmox Cluster Reboot Successful"
          description: "All nodes rebooted. Here is the list of running VMs/LXCs and their hosts:"
          color: 3066993
          fields: "{{ embed_fields }}"
          footer:
            text: "Reported at {{ local_time_uk }}"
  run_once: true
  delegate_to: localhost