- name: Get all VMs and LXCs with their states
  shell: |
    echo "=== VMs ==="
    qm list | awk 'NR>1 {print $1":"$2":"$3}'
    echo "=== LXCs ==="
    pct list | awk 'NR>1 {print $1":"$2":"$3}'
  register: all_vms_lxcs_raw

- name: Parse VM/LXC list
  set_fact:
    all_vms_lxcs_parsed: >-
      {%- set vms = [] -%}
      {%- set lxcs = [] -%}
      {%- set current_section = "" -%}
      {%- for line in all_vms_lxcs_raw.stdout_lines -%}
        {%- if line == "=== VMs ===" -%}
          {%- set current_section = "vm" -%}
        {%- elif line == "=== LXCs ===" -%}
          {%- set current_section = "lxc" -%}
        {%- elif line and current_section -%}
          {%- set parts = line.split(':') -%}
          {%- if parts|length >= 3 -%}
            {%- if current_section == "vm" -%}
              {{ vms.append({'type': 'vm', 'id': parts[0], 'name': parts[1], 'state': parts[2]}) }}
            {%- else -%}
              {{ lxcs.append({'type': 'lxc', 'id': parts[0], 'name': parts[1], 'state': parts[2]}) }}
            {%- endif -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ vms + lxcs }}

- name: Get HA-managed resources
  shell: |
    ha-manager config | grep -E '^(vm|ct):' | awk -F: '{print $1":"$2}'
  register: ha_resources
  changed_when: false

- name: Separate HA and non-HA VMs/LXCs
  set_fact:
    ha_vms_lxcs: >-
      {%- set ha_ids = ha_resources.stdout_lines | map('split', ':') | map('last') | list -%}
      {{ all_vms_lxcs_parsed | selectattr('id', 'in', ha_ids) | list }}
    non_ha_vms_lxcs: >-
      {%- set ha_ids = ha_resources.stdout_lines | map('split', ':') | map('last') | list -%}
      {{ all_vms_lxcs_parsed | rejectattr('id', 'in', ha_ids) | list }}

- name: Set global facts for VM/LXC data
  set_fact:
    proxmox_ha_vms_lxcs: "{{ ha_vms_lxcs }}"
    proxmox_non_ha_vms_lxcs: "{{ non_ha_vms_lxcs }}"

- name: Gather initial HA-Managed VMs/LXCs on this node
  shell: |
    ha-manager status | awk '/^Resources:/,/^$/ {if ($2 == "started" && $3 == "'$(hostname)'") print $1}'
  register: vms_on_node_result
  changed_when: false

- name: Set fact for initial HA-Managed VMs/LXCs on this node
  set_fact:
    vms_on_node: "{{ vms_on_node_result.stdout_lines }}"