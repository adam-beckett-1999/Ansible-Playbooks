- name: Get all VMs and LXCs with their states
  shell: |
    echo "=== VMs ==="
    qm list | awk 'NR>1 {print $1":"$2":"$3}'
    echo "=== LXCs ==="
    pct list | awk 'NR>1 {print $1":"$2":"$3}'
  register: all_vms_lxcs_raw

- name: Initialize VM/LXC lists
  set_fact:
    all_vms_lxcs_parsed: []

- name: Parse VM data
  set_fact:
    all_vms_lxcs_parsed: "{{ all_vms_lxcs_parsed + [{'type': 'vm', 'id': parts[0], 'name': parts[1], 'state': parts[2]}] }}"
  vars:
    parts: "{{ item.split(':') }}"
  loop: "{{ all_vms_lxcs_raw.stdout_lines }}"
  when: 
    - item != "=== VMs ==="
    - item != "=== LXCs ==="
    - item != ""
    - parts | length >= 3
    - all_vms_lxcs_raw.stdout_lines.index(item) > all_vms_lxcs_raw.stdout_lines.index("=== VMs ===")
    - all_vms_lxcs_raw.stdout_lines.index(item) < all_vms_lxcs_raw.stdout_lines.index("=== LXCs ===")

- name: Parse LXC data
  set_fact:
    all_vms_lxcs_parsed: "{{ all_vms_lxcs_parsed + [{'type': 'lxc', 'id': parts[0], 'name': parts[1], 'state': parts[2]}] }}"
  vars:
    parts: "{{ item.split(':') }}"
  loop: "{{ all_vms_lxcs_raw.stdout_lines }}"
  when: 
    - item != "=== VMs ==="
    - item != "=== LXCs ==="
    - item != ""
    - parts | length >= 3
    - all_vms_lxcs_raw.stdout_lines.index(item) > all_vms_lxcs_raw.stdout_lines.index("=== LXCs ===")

- name: Get HA-managed resources
  shell: |
    ha-manager config | grep -E '^(vm|ct):' | awk -F: '{print $2}'
  register: ha_resources
  changed_when: false
  failed_when: false

- name: Separate HA and non-HA VMs/LXCs
  set_fact:
    ha_vms_lxcs: "{{ all_vms_lxcs_parsed | selectattr('id', 'in', ha_resources.stdout_lines) | list }}"
    non_ha_vms_lxcs: "{{ all_vms_lxcs_parsed | rejectattr('id', 'in', ha_resources.stdout_lines) | list }}"

- name: Set global facts for VM/LXC data (persisted across roles)
  set_fact:
    proxmox_ha_vms_lxcs: "{{ ha_vms_lxcs }}"
    proxmox_non_ha_vms_lxcs: "{{ non_ha_vms_lxcs }}"
    cacheable: yes

- name: Gather initial HA-Managed VMs/LXCs on this node
  shell: |
    ha-manager status | awk '/^Resources:/,/^$/ {if ($2 == "started" && $3 == "'$(hostname)'") print $1}'
  register: vms_on_node_result
  changed_when: false

- name: Set fact for initial HA-Managed VMs/LXCs on this node (persisted)
  set_fact:
    vms_on_node: "{{ vms_on_node_result.stdout_lines }}"
    initial_ha_vms_on_node: "{{ vms_on_node_result.stdout_lines }}"
    cacheable: yes