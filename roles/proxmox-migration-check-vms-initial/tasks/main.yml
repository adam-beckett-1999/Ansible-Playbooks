- name: Get all VMs and LXCs with their states
  shell: |
    echo "VM_START"
    qm list | awk 'NR>1 && NF>=4 {print $1":"$4":"$2":vm"}'
    echo "LXC_START"
    pct list | awk 'NR>1 && NF>=4 {print $1":"$4":"$2":lxc"}'
    echo "END_DATA"
  register: all_vms_lxcs_raw

- name: Debug - Show raw VM/LXC data
  debug:
    var: all_vms_lxcs_raw.stdout_lines

- name: Parse all VMs and LXCs
  set_fact:
    all_vms_lxcs_parsed: []

- name: Build VM/LXC list from parsed data
  set_fact:
    all_vms_lxcs_parsed: "{{ all_vms_lxcs_parsed + [{'type': parts[3], 'id': parts[0], 'name': parts[1], 'state': parts[2]}] }}"
  vars:
    parts: "{{ item.split(':') }}"
  loop: "{{ all_vms_lxcs_raw.stdout_lines }}"
  when:
    - item not in ['VM_START', 'LXC_START', 'END_DATA']
    - parts | length == 4
    - item != ""

- name: Debug - Show parsed VM/LXC data from lists
  debug:
    var: all_vms_lxcs_parsed

- name: Get HA-managed resource IDs
  shell: |
    ha-manager config | grep -E '^(vm|ct):' | awk -F: '{print $2}'
  register: ha_resources
  changed_when: false
  failed_when: false

- name: Debug - Show HA resources
  debug:
    var: ha_resources.stdout_lines

- name: Get detailed info for each HA resource from HA status
  shell: |
    ha-manager status | awk '/^service/ {
      if ($2 ~ /^(vm|ct):/) {
        # Extract ID from vm:123 or ct:123
        split($2, parts, ":")
        resource_type = parts[1]
        resource_id = parts[2]
        # Extract node from (NODE-NAME, state)
        gsub(/[(),]/, "", $3)
        node = $3
        gsub(/[(),]/, "", $4)
        state = $4
        print resource_id":"resource_type":"state":"node
      }
    }'
  register: ha_status_details
  changed_when: false
  failed_when: false

- name: Debug - Show HA status details
  debug:
    var: ha_status_details.stdout_lines

- name: Add HA resources with their current status
  set_fact:
    all_vms_lxcs_parsed: "{{ all_vms_lxcs_parsed + [{'type': parts[1], 'id': parts[0], 'name': parts[1] + '-' + parts[0], 'state': parts[2], 'node': parts[3]}] }}"
  vars:
    parts: "{{ item.split(':') }}"
  loop: "{{ ha_status_details.stdout_lines }}"
  when:
    - parts | length >= 4
    - parts[0] not in (all_vms_lxcs_parsed | selectattr('type', 'equalto', parts[1]) | map(attribute='id') | list)

- name: Debug - Show complete VM/LXC data after adding HA resources
  debug:
    var: all_vms_lxcs_parsed

- name: Separate HA and non-HA VMs/LXCs
  set_fact:
    ha_vms_lxcs: "{{ all_vms_lxcs_parsed | selectattr('id', 'in', ha_resources.stdout_lines) | list }}"
    non_ha_vms_lxcs: "{{ all_vms_lxcs_parsed | rejectattr('id', 'in', ha_resources.stdout_lines) | list }}"

- name: Debug - Show separated VM/LXC data
  debug:
    msg:
      - "HA VMs/LXCs: {{ ha_vms_lxcs }}"
      - "Non-HA VMs/LXCs: {{ non_ha_vms_lxcs }}"

- name: Create fact file to persist data between plays
  copy:
    content: |
      proxmox_ha_vms_lxcs: {{ ha_vms_lxcs | to_json }}
      proxmox_non_ha_vms_lxcs: {{ non_ha_vms_lxcs | to_json }}
    dest: "/tmp/proxmox_initial_data_{{ inventory_hostname }}.yml"
  delegate_to: localhost

- name: Set global facts for VM/LXC data
  set_fact:
    proxmox_ha_vms_lxcs: "{{ ha_vms_lxcs }}"
    proxmox_non_ha_vms_lxcs: "{{ non_ha_vms_lxcs }}"
    cacheable: yes

- name: Gather initial HA-Managed VMs/LXCs on this node - USE ANSIBLE HOSTNAME
  shell: |
    ha-manager status | awk '/^service/ {
      if ($2 ~ /^(vm|ct):/ && $0 ~ "{{ inventory_hostname }}") {
        print $2
      }
    }'
  register: vms_on_node_result
  changed_when: false
  failed_when: false

- name: Debug - Show raw VMs on this node result
  debug:
    var: vms_on_node_result

- name: Set fact for initial HA-Managed VMs/LXCs on this node
  set_fact:
    vms_on_node: "{{ vms_on_node_result.stdout_lines | select('regex', '^(vm|ct):') | list }}"
    cacheable: yes

- name: Debug - Show final vms_on_node value
  debug:
    var: vms_on_node