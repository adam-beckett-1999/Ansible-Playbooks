- name: Get all VMs and LXCs with their states
  shell: |
    echo "VM_START"
    qm list | awk 'NR>1 && NF>=4 {print $1":"$4":"$2":vm"}'
    echo "LXC_START"
    pct list | awk 'NR>1 && NF>=4 {print $1":"$4":"$2":lxc"}'
    echo "END_DATA"
  register: all_vms_lxcs_raw

- name: Debug - Show raw VM/LXC data
  debug:
    var: all_vms_lxcs_raw.stdout_lines

- name: Parse all VMs and LXCs
  set_fact:
    all_vms_lxcs_parsed: []

- name: Build VM/LXC list
  set_fact:
    all_vms_lxcs_parsed: "{{ all_vms_lxcs_parsed + [{'type': parts[3], 'id': parts[0], 'name': parts[1], 'state': parts[2]}] }}"
  vars:
    parts: "{{ item.split(':') }}"
  loop: "{{ all_vms_lxcs_raw.stdout_lines }}"
  when:
    - item not in ['VM_START', 'LXC_START', 'END_DATA']
    - parts | length == 4

- name: Debug - Show parsed VM/LXC data
  debug:
    var: all_vms_lxcs_parsed

- name: Get HA-managed resource IDs
  shell: |
    ha-manager config | grep -E '^(vm|ct):' | awk -F: '{print $2}'
  register: ha_resources
  changed_when: false
  failed_when: false

- name: Debug - Show HA resources
  debug:
    var: ha_resources.stdout_lines

- name: Separate HA and non-HA VMs/LXCs
  set_fact:
    ha_vms_lxcs: "{{ all_vms_lxcs_parsed | selectattr('id', 'in', ha_resources.stdout_lines) | list }}"
    non_ha_vms_lxcs: "{{ all_vms_lxcs_parsed | rejectattr('id', 'in', ha_resources.stdout_lines) | list }}"

- name: Debug - Show separated VM/LXC data
  debug:
    msg:
      - "HA VMs/LXCs: {{ ha_vms_lxcs }}"
      - "Non-HA VMs/LXCs: {{ non_ha_vms_lxcs }}"

- name: Create fact file to persist data between plays
  copy:
    content: |
      proxmox_ha_vms_lxcs: {{ ha_vms_lxcs | to_json }}
      proxmox_non_ha_vms_lxcs: {{ non_ha_vms_lxcs | to_json }}
    dest: "/tmp/proxmox_initial_data_{{ inventory_hostname }}.yml"
  delegate_to: localhost

- name: Set global facts for VM/LXC data
  set_fact:
    proxmox_ha_vms_lxcs: "{{ ha_vms_lxcs }}"
    proxmox_non_ha_vms_lxcs: "{{ non_ha_vms_lxcs }}"
    cacheable: yes

- name: Gather initial HA-Managed VMs/LXCs on this node
  shell: |
    ha-manager status | awk '/^service/ {if ($2 ~ /^(vm|ct):/ && $4 == "started") print $2}' | grep -F "$(hostname)"
  register: vms_on_node_result
  changed_when: false

- name: Set fact for initial HA-Managed VMs/LXCs on this node
  set_fact:
    vms_on_node: "{{ vms_on_node_result.stdout_lines }}"
    cacheable: yes