- name: Wait for HA migrations to settle before checking VMs/LXCs
  ansible.builtin.pause:
    seconds: 30

- name: Check if vms_on_node variable exists
  ansible.builtin.fail:
    msg: "vms_on_node variable not found. Initial VM check may have failed."
  when: vms_on_node is not defined

- name: Wait for all VMs/LXCs to return to this node
  ansible.builtin.shell: |
    set -o pipefail
    ha-manager status | awk '/^service/ {
      if ($2 ~ /^(vm|ct):/ && $0 ~ "{{ inventory_hostname }}") {
        print $2
      }
    }'
  register: vms_now_on_node_raw
  changed_when: false
  failed_when: false
  until: >
    (
      (vms_now_on_node_raw.stdout_lines
        | select('regex', '^(vm|ct):')
        | list)
      | difference(vms_on_node)
      | length == 0
    )
    and
    (
      vms_on_node
      | difference(
          (vms_now_on_node_raw.stdout_lines
            | select('regex', '^(vm|ct):')
            | list)
        )
      | length == 0
    )
  retries: 20
  delay: 20

- name: Filter to only valid vm/ct entries
  ansible.builtin.set_fact:
    vms_now_on_node_filtered: "{{ vms_now_on_node_raw.stdout_lines | select('regex', '^(vm|ct):') | list }}"

- name: Final assertion check
  ansible.builtin.assert:
    that:
      - vms_on_node | difference(vms_now_on_node_filtered) | length == 0
    fail_msg: "Not all VMs/LXCs have returned to this node. Missing: {{ vms_on_node | difference(vms_now_on_node_filtered) }}"
    success_msg: "All VMs/LXCs have returned to this node: {{ vms_on_node }}"
