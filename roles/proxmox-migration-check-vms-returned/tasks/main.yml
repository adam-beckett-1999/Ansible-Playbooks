- name: Wait for HA migrations to settle before checking VMs/LXCs
  pause:
    seconds: 30

- name: Debug - Show initial VMs that should return
  debug:
    var: vms_on_node

- name: Debug - Show current hostname
  debug:
    var: inventory_hostname

- name: Check if vms_on_node variable exists
  fail:
    msg: "vms_on_node variable not found. Initial VM check may have failed."
  when: vms_on_node is not defined

- name: Wait for all VMs/LXCs to return to this node (with retries)
  block:
    - name: Get list of VMs/LXCs currently running on this node
      shell: |
        ha-manager status | awk '/^service/ {
          if ($2 ~ /^(vm|ct):/ && $0 ~ "{{ inventory_hostname }}") {
            print $2
          }
        }'
      register: vms_now_on_node_raw
      changed_when: false
      failed_when: false

    - name: Filter to only valid vm/ct entries
      set_fact:
        vms_now_on_node_filtered: "{{ vms_now_on_node_raw.stdout_lines | select('regex', '^(vm|ct):') | list }}"

    - name: Debug - Show current check iteration
      debug:
        msg:
          - "Expected VMs (vms_on_node): {{ vms_on_node }}"
          - "Current VMs (vms_now_on_node): {{ vms_now_on_node_filtered }}"
          - "Missing VMs: {{ vms_on_node | difference(vms_now_on_node_filtered) }}"
          - "Extra VMs: {{ vms_now_on_node_filtered | difference(vms_on_node) }}"

    - name: Check if all VMs/LXCs have returned
      assert:
        that:
          - vms_on_node | difference(vms_now_on_node_filtered) | length == 0
        fail_msg: "Not all VMs/LXCs have returned to this node. Missing: {{ vms_on_node | difference(vms_now_on_node_filtered) }}"
        success_msg: "All VMs/LXCs have returned to this node: {{ vms_on_node }}"

  rescue:
    - name: Show full HA status for troubleshooting on failure
      shell: ha-manager status
      register: full_ha_status
      changed_when: false

    - name: Debug - Full HA status on failure
      debug:
        var: full_ha_status.stdout_lines

    - name: Re-raise the failure
      fail:
        msg: "VM/LXC return check failed. See debug output above."

  # This is the retry loop
  register: vm_return_check
  until: vm_return_check is succeeded
  retries: 20
  delay: 30

- name: Set final state for reporting
  set_fact:
    final_ha_vms_on_node: "{{ vms_now_on_node_filtered }}"
    migration_check_completed: true
    cacheable: yes

- name: Final success message
  debug:
    msg: "✅ All VMs/LXCs have successfully returned to {{ inventory_hostname }}: {{ vms_now_on_node_filtered }}"