- name: Ensure system time is synchronized
  block:
    - name: Check if systemd-timesyncd is available
      ansible.builtin.stat:
        path: /lib/systemd/system/systemd-timesyncd.service
      register: timesyncd_available

    - name: Use systemd-timesyncd for time synchronization (modern systems)
      block:
        - name: Start and enable systemd-timesyncd
          ansible.builtin.systemd:
            name: systemd-timesyncd
            state: started
            enabled: yes
          become: yes

        - name: Force time synchronization
          ansible.builtin.command: timedatectl set-ntp true
          become: yes

        - name: Force immediate time sync
          ansible.builtin.command: systemctl restart systemd-timesyncd
          become: yes

        - name: Wait for time synchronization to complete
          ansible.builtin.pause:
            seconds: 10

        - name: Verify time sync status
          ansible.builtin.command: timedatectl status
          register: timedate_status
          become: yes
          changed_when: false
      when: timesyncd_available.stat.exists

    - name: Use NTP for time synchronization (fallback)
      block:
        - name: Install NTP packages
          ansible.builtin.apt:
            name:
              - ntp
              - ntpdate
            state: present
            update_cache: yes
          become: yes

        - name: Stop NTP service temporarily
          ansible.builtin.systemd:
            name: ntp
            state: stopped
          become: yes
          ignore_errors: yes

        - name: Synchronize time with multiple NTP servers
          ansible.builtin.command: "{{ item }}"
          become: yes
          ignore_errors: yes
          loop:
            - "ntpdate -s time.nist.gov"
            - "ntpdate -s pool.ntp.org"
            - "ntpdate -s time.google.com"

        - name: Start and enable NTP service
          ansible.builtin.systemd:
            name: ntp
            state: started
            enabled: yes
          become: yes

        - name: Wait for NTP synchronization
          ansible.builtin.pause:
            seconds: 10
      when: not timesyncd_available.stat.exists

    - name: Final time synchronization wait
      ansible.builtin.pause:
        seconds: 5

    - name: Display current time status
      ansible.builtin.debug:
        msg: "Time synchronization completed. Current time: {{ ansible_date_time.iso8601 }}"
  when: ansible_os_family == 'Debian'
