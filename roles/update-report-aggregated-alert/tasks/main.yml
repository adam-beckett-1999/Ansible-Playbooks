- name: Update apt cache [Linux - Debian]
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Get list of upgradable packages [Debian]
  ansible.builtin.shell: apt list --upgradable 2>/dev/null | tail -n +2
  register: apt_upgradable_raw
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Get list of security updates [Debian]
  ansible.builtin.shell: |
    unattended-upgrade --dry-run -d | grep "Checking: " | cut -d' ' -f2
  register: security_updates_raw
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure dnf plugins are installed [RedHat]
  ansible.builtin.package:
    name: dnf-plugins-core
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Get list of upgradable packages [RedHat]
  ansible.builtin.shell: dnf check-update || true
  register: dnf_upgradable_raw
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

- name: Get list of security updates [RedHat]
  ansible.builtin.shell: dnf updateinfo list security all || true
  register: dnf_security_raw
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

- name: Get Windows update list (search only)
  ansible.windows.win_updates:
    category_names:
      - Security Updates
      - Critical Updates
      - Updates
      - Definition Updates
    state: searched
  register: win_update_result
  when: ansible_facts['os_family'] == "Windows"

- name: Parse and collect report data [Debian]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: Debian
      upgradable: "{{ apt_upgradable_raw.stdout_lines | default([]) }}"
      security: "{{ security_updates_raw.stdout_lines | default([]) }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Parse and collect report data [RedHat]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: RedHat
      upgradable: "{{ dnf_upgradable_raw.stdout_lines | default([]) }}"
      security: "{{ dnf_security_raw.stdout_lines | default([]) }}"
  when: ansible_facts['os_family'] == "RedHat"

- name: Parse and collect report data [Windows]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: Windows
      upgradable: "{{ win_update_result.updates.values() | map(attribute='title') | list if win_update_result.updates is defined else [] }}"
      security: >-
        {{
          win_update_result.updates.values()
          | selectattr('categories', 'search', '(Security Updates|Critical Updates|Definition Updates)')
          | map(attribute='title')
          | list
          if win_update_result.updates is defined else []
        }}
  when: ansible_facts['os_family'] == "Windows"

- name: Convert UTC time to UK local time (BST/GMT)
  ansible.builtin.set_fact:
    local_time_uk: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S %Z\"') }}"

- name: Collect report data from hosts that defined it
  ansible.builtin.set_fact:
    all_reports: >-
      {{
        ansible_play_hosts
        | map('extract', hostvars)
        | selectattr('report_data', 'defined')
        | map(attribute='report_data')
        | list
      }}
  run_once: true

- name: Create summary statistics
  ansible.builtin.set_fact:
    summary_stats:
      total_hosts: "{{ all_reports | length }}"
      hosts_with_updates: "{{ all_reports | selectattr('upgradable', 'defined') | selectattr('upgradable', 'length', '>', 0) | list | length }}"
      hosts_with_security: "{{ all_reports | selectattr('security', 'defined') | selectattr('security', 'length', '>', 0) | list | length }}"
      total_upgradable: "{{ all_reports | map(attribute='upgradable') | map('default', []) | map('length') | sum }}"
      total_security: "{{ all_reports | map(attribute='security') | map('default', []) | map('length') | sum }}"
  run_once: true

- name: Create compact host status list
  ansible.builtin.set_fact:
    host_status_lines: >-
      {{
        all_reports | map('extract', host_line_template) | list
      }}
  vars:
    host_line_template: >-
      {%- set upgradable_count = item.upgradable | default([]) | length -%}
      {%- set security_count = item.security | default([]) | length -%}
      {%- if upgradable_count == 0 -%}✅ {{ item.hostname | default('Unknown') }} - Up to date{%- else -%}{%- if security_count > 0 -%}🔴 {{ item.hostname | default('Unknown') }} - {{ upgradable_count }} updates ({{ security_count }} security){%- else -%}🟡 {{ item.hostname | default('Unknown') }} - {{ upgradable_count }} updates{%- endif -%}{%- endif -%}
  run_once: true

- name: Split host status into chunks to avoid embed limits
  ansible.builtin.set_fact:
    host_chunks: >-
      {{
        host_status_lines | batch(15) | list
      }}
  run_once: true

- name: Create embed fields from host chunks
  ansible.builtin.set_fact:
    embed_fields: >-
      {{
        host_chunks | map('join', '\n') | list |
        map('regex_replace', '^', '') |
        enumerate |
        map('extract', chunk_field_template) |
        list
      }}
  vars:
    chunk_field_template:
      name: "Hosts {{ item.0 * 15 + 1 }}-{{ [item.0 * 15 + 15, host_status_lines | length] | min }}"
      value: "{{ item.1 }}"
      inline: true
  run_once: true

- name: Send single aggregated Discord alert
  ansible.builtin.uri:
    url: "{{ update_report_discord_webhook_url }}"
    method: POST
    headers:
      Content-Type: "application/json"
    status_code: 204
    body_format: json
    body:
      embeds:
        - title: "🔐 Update Report for VMs & LXCs"
          description: |
            **Summary:** {{ summary_stats.total_hosts }} hosts checked
            📊 **{{ summary_stats.hosts_with_updates }}** hosts need updates ({{ summary_stats.total_upgradable }} total packages)
            ⚠️ **{{ summary_stats.hosts_with_security }}** hosts have security updates ({{ summary_stats.total_security }} packages)

            **Legend:**
            ✅ Up to date | 🟡 General updates | 🔴 Security updates available
          color: >-
            {%- if summary_stats.hosts_with_security > 0 -%}15158332
            {%- elif summary_stats.hosts_with_updates > 0 -%}16776960
            {%- else -%}3066993
            {%- endif -%}
          fields: "{{ embed_fields }}"
          footer:
            text: "Reported at {{ local_time_uk }}"
  run_once: true
  delegate_to: localhost

- name: Wait to avoid Discord rate limits
  ansible.builtin.pause:
    seconds: 2
  run_once: true

- name: Send Discord prompt with styled embed and interactive button via bot API
  ansible.builtin.uri:
    url: "{{ discord_channel_url }}"
    method: POST
    headers:
      Content-Type: "application/json"
      Authorization: "Bot {{ discord_bot_token }}"
    body_format: json
    body:
      embeds:
        - title: "⚙️ Update Playbook Trigger"
          description: "Do you want to trigger the update playbook now?\nClick the button below to start the update process."
          color: 3447003
          footer:
            text: "Triggered from Ansible"
      components:
        - type: 1
          components:
            - type: 2
              style: 1
              label: "Run Update Playbook"
              custom_id: "{{ custom_id }}"
  run_once: true
  delegate_to: localhost
