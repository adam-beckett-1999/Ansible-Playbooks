- name: Update apt cache [Linux - Debian]
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Get list of upgradable packages [Debian]
  ansible.builtin.shell: |
    set -o pipefail
    apt list --upgradable 2>/dev/null | tail -n +2
  args:
    executable: /usr/bin/bash
  register: apt_upgradable_raw
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Get list of security updates [Debian]
  ansible.builtin.shell: |
    set -o pipefail
    apt-get upgrade -s 2>/dev/null |
    grep -E "^Inst.*security" |
    awk '{print $2}' || true
  args:
    executable: /usr/bin/bash
  register: security_updates_raw
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure dnf plugins are installed [RedHat]
  ansible.builtin.package:
    name: dnf-plugins-core
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Get list of upgradable packages [RedHat]
  ansible.builtin.shell: dnf check-update || true
  register: dnf_upgradable_raw
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

- name: Get list of security updates [RedHat]
  ansible.builtin.shell: dnf updateinfo list security all || true
  register: dnf_security_raw
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

- name: Get Windows update list (search only)
  ansible.windows.win_updates:
    category_names:
      - Security Updates
      - Critical Updates
      - Updates
      - Definition Updates
    state: searched
  register: win_update_result
  when: ansible_facts['os_family'] == "Windows"

- name: Parse and collect report data [Debian]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: Debian
      upgradable: "{{ apt_upgradable_raw.stdout_lines | default([]) }}"
      security: "{{ security_updates_raw.stdout_lines | default([]) }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Parse and collect report data [RedHat]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: RedHat
      upgradable: "{{ dnf_upgradable_raw.stdout_lines | default([]) }}"
      security: "{{ dnf_security_raw.stdout_lines | default([]) }}"
  when: ansible_facts['os_family'] == "RedHat"

- name: Parse and collect report data [Windows]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: Windows
      upgradable: "{{ win_update_result.updates.values() | map(attribute='title') | list if win_update_result.updates is defined else [] }}"
      security: >-
        {{
        win_update_result.updates.values()
        | selectattr('categories', 'search', '(Security Updates|Critical Updates|Definition Updates)')
        | map(attribute='title')
        | list
        if win_update_result.updates is defined else []
        }}
  when: ansible_facts['os_family'] == "Windows"

- name: Collect report data from hosts that defined it
  ansible.builtin.set_fact:
    all_reports: >-
      {{
      ansible_play_hosts
      | map('extract', hostvars)
      | selectattr('report_data', 'defined')
      | map(attribute='report_data')
      | list
      }}
  run_once: true

- name: Create summary statistics
  ansible.builtin.set_fact:
    summary_stats:
      total_hosts: "{{ all_reports | length }}"
      hosts_with_updates: >-
        {{
        all_reports
        | map(attribute='upgradable')
        | map('default', [])
        | map('length')
        | select('>', 0)
        | list
        | length
        }}
      hosts_with_security: >-
        {{
        all_reports
        | map(attribute='security')
        | map('default', [])
        | map('length')
        | select('>', 0)
        | list
        | length
        }}
      total_upgradable: "{{ all_reports | map(attribute='upgradable') | map('default', []) | map('length') | sum }}"
      total_security: "{{ all_reports | map(attribute='security') | map('default', []) | map('length') | sum }}"
  run_once: true

- name: Debug effective report URL
  ansible.builtin.debug:
    msg:
      - "env_url={{ lookup('env', 'BOT_REPORTS_URL') | default('', true) | trim }}"
      - "var_url={{ update_report_bot_reports_url | default('', true) | trim }}"
  run_once: true
  delegate_to: localhost

- name: Assert report URL present
  ansible.builtin.assert:
    that:
      - update_report_bot_reports_url | default('', true) | trim | length > 0
      - update_report_bot_reports_url | trim is match('^https?://')
    fail_msg: "Missing or invalid bot report URL in runtime context."
  run_once: true
  delegate_to: localhost

- name: Send aggregated report payload to Semaphore Discord Bot
  ansible.builtin.uri:
    url: "{{ update_report_bot_reports_url }}"
    method: POST
    headers: >-
      {{
      {'Content-Type': 'application/json'}
      | combine(
      (update_report_bot_reports_token | default('') | length > 0)
      | ternary({'Authorization': 'Bearer ' ~ update_report_bot_reports_token}, {})
      )
      }}
    status_code:
      - 200
      - 202
    body_format: json
    body:
      scope: "{{ update_report_scope }}"
      title: "{{ update_report_title }}"
      generated_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      summary:
        total_hosts: "{{ summary_stats.total_hosts | int }}"
        hosts_with_updates: "{{ summary_stats.hosts_with_updates | int }}"
        hosts_with_security: "{{ summary_stats.hosts_with_security | int }}"
        total_upgradable: "{{ summary_stats.total_upgradable | int }}"
        total_security: "{{ summary_stats.total_security | int }}"
      hosts: "{{ all_reports }}"
  run_once: true
  delegate_to: localhost