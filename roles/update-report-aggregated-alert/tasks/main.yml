- name: Update apt cache (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: yes
  when: ansible_facts['os_family'] == "Debian"

- name: Get list of upgradable packages
  ansible.builtin.shell: apt list --upgradable 2>/dev/null | tail -n +2
  register: apt_upgradable_raw
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Get list of security updates
  ansible.builtin.shell: |
    unattended-upgrade --dry-run -d | grep "Checking: " | cut -d' ' -f2
  register: security_updates_raw
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Parse lists into facts
  set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      upgradable: "{{ apt_upgradable_raw.stdout_lines | default([]) }}"
      security: "{{ security_updates_raw.stdout_lines | default([]) }}"

- name: Convert UTC time to UK local time (BST/GMT)
  set_fact:
    local_time_uk: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S %Z\"') }}"

- name: Collect report data from hosts that defined it
  set_fact:
    all_reports: >-
      {{
        ansible_play_hosts_all
        | map('extract', hostvars)
        | selectattr('report_data', 'defined')
        | map(attribute='report_data')
        | list
      }}

- name: Initialise embed_fields list
  set_fact:
    embed_fields: []

- name: Append embed field for each report with internal spacing
  set_fact:
    embed_fields: "{{ embed_fields + [item_field] }}"
  vars:
    item_field:
      name: "{{ item.hostname | default('Unknown Host') }} (📦 {{ item.upgradable | default([]) | length }}, ⚠ {{ item.security | default([]) | length }} sec)"
      value: |
        **🔐 Security Updates:**
        {% if item.security | default([]) | length > 0 %}
        {{ item.security | map('regex_replace', '^', '• ') | join('\n') }}
        {% else %}
        ✅ No security updates
        {% endif %}
        
        **📦 All Upgradable Packages:**
        {% if item.upgradable | default([]) | length > 0 %}
        {{ item.upgradable | map('regex_replace', '^', '• ') | join('\n') }}
        {% else %}
        ✅ System is fully up-to-date
        {% endif %}

        ​ 
      inline: false
  loop: "{{ all_reports }}"
  run_once: true

- name: Send single aggregated Discord alert
  uri:
    url: "{{ update_report_discord_webhook_url }}"
    method: POST
    headers:
      Content-Type: "application/json"
    status_code: 204
    body_format: json
    body:
      embeds:
        - title: "🔐 Aggregate Security Update Report"
          description: "Summary across {{ all_reports | length }} hosts"
          color: 16753920
          fields: "{{ embed_fields }}"
          footer:
            text: "Reported at {{ local_time_uk }}"
  run_once: true