- name: Update apt cache [Linux - Debian]
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Get list of upgradable packages [Debian]
  ansible.builtin.shell: |
    set -o pipefail
    apt list --upgradable 2>/dev/null | tail -n +2
  args:
    executable: /usr/bin/bash
  register: apt_upgradable_raw
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Check if unattended-upgrades is available [Debian]
  ansible.builtin.command: which unattended-upgrade
  register: unattended_upgrade_check
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Get list of security updates using unattended-upgrades [Debian]
  ansible.builtin.shell: |
    set -o pipefail
    unattended-upgrade --dry-run -d 2>/dev/null | grep "Checking: " | cut -d' ' -f2 || true
  args:
    executable: /usr/bin/bash
  register: security_updates_unattended
  changed_when: false
  when:
    - ansible_facts['os_family'] == "Debian"
    - unattended_upgrade_check.rc == 0

- name: Get list of security updates using apt [Debian - fallback]
  ansible.builtin.shell: |
    set -o pipefail
    apt-cache policy $(apt list --upgradable 2>/dev/null | tail -n +2 | cut -d'/' -f1) 2>/dev/null | grep -E "security|updates" | wc -l || echo "0"
  args:
    executable: /usr/bin/bash
  register: security_updates_apt
  changed_when: false
  when:
    - ansible_facts['os_family'] == "Debian"
    - unattended_upgrade_check.rc != 0

- name: Set security updates fact [Debian]
  ansible.builtin.set_fact:
    security_updates_raw:
      stdout_lines: >-
        {{
          security_updates_unattended.stdout_lines | default([])
          if unattended_upgrade_check.rc == 0
          else ['Security updates: ' + (security_updates_apt.stdout | default('0'))]
        }}
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure dnf plugins are installed [RedHat]
  ansible.builtin.package:
    name: dnf-plugins-core
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Get list of upgradable packages [RedHat]
  ansible.builtin.shell: dnf check-update || true
  register: dnf_upgradable_raw
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

- name: Get list of security updates [RedHat]
  ansible.builtin.shell: dnf updateinfo list security all || true
  register: dnf_security_raw
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

- name: Get Windows update list (search only)
  ansible.windows.win_updates:
    category_names:
      - Security Updates
      - Critical Updates
      - Updates
      - Definition Updates
    state: searched
  register: win_update_result
  when: ansible_facts['os_family'] == "Windows"

- name: Parse and collect report data [Debian]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: Debian
      upgradable: "{{ apt_upgradable_raw.stdout_lines | default([]) }}"
      security: "{{ security_updates_raw.stdout_lines | default([]) }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Parse and collect report data [RedHat]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: RedHat
      upgradable: "{{ dnf_upgradable_raw.stdout_lines | default([]) }}"
      security: "{{ dnf_security_raw.stdout_lines | default([]) }}"
  when: ansible_facts['os_family'] == "RedHat"

- name: Parse and collect report data [Windows]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: Windows
      upgradable: "{{ win_update_result.updates.values() | map(attribute='title') | list if win_update_result.updates is defined else [] }}"
      security: >-
        {{
          win_update_result.updates.values()
          | selectattr('categories', 'search', '(Security Updates|Critical Updates|Definition Updates)')
          | map(attribute='title')
          | list
          if win_update_result.updates is defined else []
        }}
  when: ansible_facts['os_family'] == "Windows"

- name: Convert UTC time to UK local time (BST/GMT)
  ansible.builtin.set_fact:
    local_time_uk: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S %Z\"') }}"

- name: Send report to Discord using embed
  ansible.builtin.uri:
    url: "{{ update_report_discord_webhook_url }}"
    method: POST
    headers:
      Content-Type: "application/json"
    status_code: 204
    body_format: json
    body:
      embeds:
        - title: "🔧 Update Report"
          description: "Summary for `{{ inventory_hostname }}`"
          color: 16753920  # Orange-ish highlight (in decimal, 0xFFA500)
          fields:
            - name: "📦 Total Upgradable Packages"
              value: "`{{ report_data.upgradable | length }}`"
              inline: true
            - name: "⚠️ Security Updates"
              value: "`{{ report_data.security | length }}`"
              inline: true
            - name: "🔸 Affected Packages"
              value: >-
                {% if report_data.security | length > 0 %}
                  {{ report_data.security | map('regex_replace', '^', '• ') | join('\n') }}
                {% else %}
                  No security updates found.
                {% endif %}
          footer:
            text: "Reported by Ansible at {{ local_time_uk }}"
  register: discord_response
  until: discord_response.status == 204
  retries: 5
  delay: 2
  delegate_to: localhost
