- name: Update apt cache [Linux - Debian]
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Get list of upgradable packages [Debian]
  ansible.builtin.shell: |
    set -o pipefail
    apt list --upgradable 2>/dev/null | tail -n +2
  args:
    executable: /usr/bin/bash
  register: apt_upgradable_raw
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Get list of security updates [Debian]
  ansible.builtin.shell: |
    set -o pipefail
    apt-get upgrade -s 2>/dev/null | grep -E "^Inst.*security" | awk '{print $2}' || true
  args:
    executable: /usr/bin/bash
  register: security_updates_raw
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure dnf plugins are installed [RedHat]
  ansible.builtin.package:
    name: dnf-plugins-core
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Get list of upgradable packages [RedHat]
  ansible.builtin.shell: dnf check-update || true
  register: dnf_upgradable_raw
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

- name: Get list of security updates [RedHat]
  ansible.builtin.shell: dnf updateinfo list security all || true
  register: dnf_security_raw
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

- name: Get Windows update list (search only)
  ansible.windows.win_updates:
    category_names:
      - Security Updates
      - Critical Updates
      - Updates
      - Definition Updates
    state: searched
  register: win_update_result
  when: ansible_facts['os_family'] == "Windows"

- name: Parse and collect report data [Debian]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: Debian
      upgradable: "{{ apt_upgradable_raw.stdout_lines | default([]) }}"
      security: "{{ security_updates_raw.stdout_lines | default([]) }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Parse and collect report data [RedHat]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: RedHat
      upgradable: "{{ dnf_upgradable_raw.stdout_lines | default([]) }}"
      security: "{{ dnf_security_raw.stdout_lines | default([]) }}"
  when: ansible_facts['os_family'] == "RedHat"

- name: Parse and collect report data [Windows]
  ansible.builtin.set_fact:
    report_data:
      hostname: "{{ inventory_hostname }}"
      os_family: Windows
      upgradable: "{{ win_update_result.updates.values() | map(attribute='title') | list if win_update_result.updates is defined else [] }}"
      security: >-
        {{
          win_update_result.updates.values()
          | selectattr('categories', 'search', '(Security Updates|Critical Updates|Definition Updates)')
          | map(attribute='title')
          | list
          if win_update_result.updates is defined else []
        }}
  when: ansible_facts['os_family'] == "Windows"

- name: Normalize role inputs
  ansible.builtin.set_fact:
    report_bot_url: "{{ update_report_bot_reports_url | default('', true) | trim }}"
    report_bot_token: "{{ update_report_bot_reports_token | default('', true) | trim }}"
    report_scope: "{{ update_report_scope | default('vms_lxcs') }}"
    report_title: "{{ update_report_title | default('Update Report') }}"
  delegate_to: localhost

- name: Validate report endpoint input
  ansible.builtin.assert:
    that:
      - report_bot_url | length > 0
      - report_bot_url is match('^https?://')
    fail_msg: "Missing or invalid update_report_bot_reports_url"
  run_once: true
  delegate_to: localhost

- name: Build single-host summary stats
  ansible.builtin.set_fact:
    summary_stats:
      total_hosts: 1
      hosts_with_updates: "{{ ((report_data.upgradable | default([]) | length) > 0) | ternary(1, 0) }}"
      hosts_with_security: "{{ ((report_data.security | default([]) | length) > 0) | ternary(1, 0) }}"
      total_upgradable: "{{ report_data.upgradable | default([]) | length }}"
      total_security: "{{ report_data.security | default([]) | length }}"

- name: Send single-host report payload to Semaphore Discord Bot
  ansible.builtin.uri:
    url: "{{ report_bot_url }}"
    method: POST
    headers: >-
      {{
        {'Content-Type': 'application/json'}
        | combine(
            (report_bot_token | length > 0)
            | ternary({'Authorization': 'Bearer ' ~ report_bot_token}, {})
          )
      }}
    status_code:
      - 200
      - 202
    body_format: json
    body:
      scope: "{{ report_scope }}"
      title: "{{ report_title }}"
      generated_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      summary:
        total_hosts: "{{ summary_stats.total_hosts | int }}"
        hosts_with_updates: "{{ summary_stats.hosts_with_updates | int }}"
        hosts_with_security: "{{ summary_stats.hosts_with_security | int }}"
        total_upgradable: "{{ summary_stats.total_upgradable | int }}"
        total_security: "{{ summary_stats.total_security | int }}"
      hosts:
        - hostname: "{{ report_data.hostname }}"
          os_family: "{{ report_data.os_family }}"
          upgradable_count: "{{ report_data.upgradable | default([]) | length }}"
          security_count: "{{ report_data.security | default([]) | length }}"
          upgradable: "{{ report_data.upgradable | default([]) }}"
          security: "{{ report_data.security | default([]) }}"
  register: bot_report_response
  until: bot_report_response.status in [200, 202]
  retries: 5
  delay: 2
  delegate_to: localhost