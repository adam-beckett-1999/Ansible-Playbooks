- name: Preliminary checks [Linux - Debian]
  ansible.builtin.file:
    path: /var/lib/apt/lists/
    state: directory
    mode: "0755"
  when: ansible_facts.os_family == "Debian"

- name: Enable Backports repository on Ubuntu Jammy Machines [Linux]
  ansible.builtin.apt_repository:
    repo: deb http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse
    state: present
  when:
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_version == '22.04'

- name: Install all updates [Linux - Debian]
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true
    autoclean: true
  when: ansible_facts.os_family == "Debian"

- name: Install all updates [Linux - RedHat/CentOS/Alma/Rocky]
  ansible.builtin.dnf:
    name: '*'
    state: present
    update_cache: true
  when: ansible_facts.os_family == "RedHat"


# Windows: Check and perform reboot if required before updates, then run update+reboot loop
- name: Check whether a Windows reboot is required before installing pending updates [Windows]
  ansible.windows.win_shell: |
    # Check multiple registry keys and conditions that indicate a reboot is required
    $rebootRequired = $false

    # Check Windows Update reboot flag
    if (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired" `
        -ErrorAction SilentlyContinue) {
        $rebootRequired = $true
    }

    # Check Component Based Servicing reboot flag
    if (Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending" `
        -ErrorAction SilentlyContinue) {
        $rebootRequired = $true
    }

    # Check Session Manager pending file operations
    $sessionManager = Get-ItemProperty `
        "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager" `
        -Name "PendingFileRenameOperations" `
        -ErrorAction SilentlyContinue
    if ($sessionManager) {
        $rebootRequired = $true
    }

    # Check SCCM Client reboot flag
    try {
        $sccmClient = Invoke-WmiMethod -Class CCM_ClientSDK -Name DetermineIfRebootPending `
            -Namespace root\ccm\clientsdk -ErrorAction SilentlyContinue
        if ($sccmClient -and ($sccmClient.RebootPending -or $sccmClient.IsHardRebootPending)) {
            $rebootRequired = $true
        }
    } catch {}

    # Output result
    Write-Output $rebootRequired
  register: update_win_reboot_required
  when: ansible_facts['os_family'] == "Windows"

- name: Set reboot_required fact [Windows]
  ansible.builtin.set_fact:
    update_reboot_required: "{{ update_win_reboot_required.stdout | trim | bool }}"
  when: ansible_facts['os_family'] == "Windows"

- name: Send Discord alert about reboot requirement before updates [Windows]
  ansible.builtin.uri:
    url: "{{ reboot_status_discord_webhook_url }}"
    method: POST
    headers:
      Content-Type: "application/json"
    status_code: 204
    body_format: json
    body:
      embeds:
        - title: "🔁 Reboot required before updates can be installed"
          description: >-
            Host `{{ inventory_hostname }}` has {{ '🔴 a pending reboot' if update_reboot_required else '✅ no reboot required' }}.
          color: "{{ 16711680 if update_reboot_required else 65280 }}"  # Red or Green
          footer:
            text: "Checked at {{ ansible_date_time.iso8601 }}"
  register: update_discord_response
  until: update_discord_response.status == 204
  retries: 5
  delay: 2
  delegate_to: localhost
  when:
    - ansible_facts['os_family'] == "Windows"
    - update_reboot_required | default(false)

- name: Reboot if a previous update or change is pending [Windows]
  ansible.windows.win_reboot:
    msg: "Rebooting before starting updates (pending reboot detected)"
    pre_reboot_delay: 30
    post_reboot_delay: 60
  when:
    - ansible_facts.os_family == "Windows"
    - update_reboot_required | default(false)

- name: Install all critical and security updates [Windows]
  ansible.windows.win_updates:
    category_names:
      - Critical Updates
      - Security Updates
      - Updates
      - Definition Updates
    state: installed
  register: update_win_update_result
  when: ansible_facts.os_family == "Windows"
