- name: Security update report and Discord notification
  hosts: pve_core_cluster_01,pve_mini_cluster_01
  roles:
    - update-report-single-alert
  vars:
    update_report_discord_webhook_url: "{{ lookup('env', 'PVE_CLUSTERS_UPDATE_REPORT_DISCORD_WEBHOOK_URL') }}"
    custom_id: run_pve_clusters_update
    discord_bot_token: "{{ lookup('env', 'DISCORD_BOT_TOKEN') }}"
    discord_channel_url: "{{ lookup('env', 'PVE_CLUSTERS_DISCORD_CHANNEL_URL') }}"