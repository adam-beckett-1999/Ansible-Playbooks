- name: Security update report and Discord notification
  hosts: proxmox_clusters
  roles:
    - update-report
  vars:
    report_bot_url: "{{ lookup('env', 'BOT_URL') }}"
    report_bot_token: "{{ lookup('env', 'BOT_TOKEN') }}"
    report_scope: "pve_clusters"
    report_title: "PVE Clusters Update Report"
