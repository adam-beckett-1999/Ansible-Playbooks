- name: Security update report and Discord notification
  hosts: virtual_infrastructure
  roles:
    - update-report-aggregated-alert
  vars:
    report_bot_url: "{{ lookup('env', 'BOT_URL') }}"
    report_bot_token: "{{ lookup('env', 'BOT_TOKEN') }}"
    report_scope: "vms_lxcs"
    report_title: "VMS/LXCS Update Report"
