- name: Update packages on VMs and Linux containers
  hosts: virtual_infrastructure
  roles:
    - update
    - reboot-required-check
  vars:
    report_bot_url: "{{ lookup('env', 'BOT_URL') }}"
    report_bot_token: "{{ lookup('env', 'BOT_TOKEN') }}"
    report_scope: "vms_lxcs"
    report_title: "VMS/LXCS Reboot Check"
